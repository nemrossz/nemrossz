<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NemRosszHírek</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Preconnect for potentially used image domains -->
    <link rel="preconnect" href="https://picsum.photos">
    
    <style>
      :root {
        /* Default fallback colors (Original Green) if JS fails */
        --bg-page: #050505;
        --bg-panel: #121212;
        --border-main: #27272a;
        --color-primary: #10b981;
        --color-secondary: #34d399;
        --color-tertiary: #fbbf24;
        --text-main: #FFFFFF;
        --text-muted: #a1a1aa;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-page);
        color: var(--text-main);
        margin: 0;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        background: #000;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-page);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-primary);
        border-radius: 4px;
        border: 2px solid var(--bg-page);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-secondary);
      }
      
      @keyframes pulse-slow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.8; }
      }
      .animate-pulse-slow {
        animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .glass-panel {
        background: var(--bg-panel);
        border: 1px solid var(--border-main);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      }
      
      .analysis-content h3.section-title {
        font-size: 1.1rem;
        font-weight: 800;
        color: var(--color-secondary);
        margin-top: 1rem;
        margin-bottom: 0.5rem;
        border-bottom: 1px solid var(--color-tertiary);
        padding-bottom: 4px;
        letter-spacing: 0.025em;
      }
      .analysis-content .bullish { color: var(--color-secondary); font-weight: 700; }
      .analysis-content .bearish { color: var(--color-tertiary); font-weight: 700; }
      .analysis-content p { margin-bottom: 0.5rem; line-height: 1.6; color: var(--text-main); }

      /* Hide scrollbar */
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {

    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

    "vite": "https://esm.sh/vite@^7.3.0",
    "fs/": "https://esm.sh/fs@^0.0.1-security/",
    "path": "https://esm.sh/path@^0.12.7",
    "express": "https://esm.sh/express@^5.2.1",
    "cors": "https://esm.sh/cors@^2.8.5",
    "url": "https://esm.sh/url@^0.11.4",
    "express-rate-limit": "https://esm.sh/express-rate-limit@^8.2.1",
    "helmet": "https://esm.sh/helmet@^8.1.0",
    "crypto": "https://esm.sh/crypto@^1.0.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="min-h-screen selection:bg-[var(--color-primary)] selection:text-white">
    <div id="root">
      <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #0A0A0E; color: #d946ef; font-family: sans-serif; font-weight: bold; flex-direction: column; gap: 20px;">
        <div style="font-size: 24px; letter-spacing: 2px; color: #c10e6a;">NEMROSSZHÍREK</div>
        <div style="width: 40px; height: 40px; border: 4px solid #eaa72b; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
